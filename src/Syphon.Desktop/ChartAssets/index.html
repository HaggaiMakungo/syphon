<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Syphon transfer speed</title><style>/* Obsidian Violet: canonical palette. Generated copies are emitted by build.mjs. */
:root {
 --ov-canvas:#050408;
 --ov-shell:#08060e;
 --ov-panel:#0e0a16;
 --ov-panel-raised:#15101f;
 --ov-control:#1b1428;
 --ov-control-hover:#261a38;
 --ov-inset:#08060f;
 --ov-border:#30213f;
 --ov-border-subtle:#22182e;
 --ov-border-hover:#694494;
 --ov-border-focus:#9c67da;
 --ov-text-primary:#ece9f2;
 --ov-text-secondary:#beb2d0;
 --ov-text-muted:#9a8baf;
 --ov-text-disabled:#766a85;
 --ov-accent:#a86ae8;
 --ov-accent-hover:#b77df0;
 --ov-accent-pressed:#8950c5;
 /* Deeper primary fills keep small off-white button labels above 4.5:1. */
 --ov-primary-top:#8245bc;
 --ov-primary-bottom:#7839b5;
 --ov-primary-hover:#8446bf;
 --ov-primary-pressed:#693096;
 --ov-glow-soft:rgba(146,77,220,0.12);
 --ov-glow-medium:rgba(146,77,220,0.22);
 --ov-glow-strong:rgba(168,106,232,0.35);
 --ov-corner-light:rgba(116,54,182,0.10);
 --ov-corner-light-secondary:rgba(116,54,182,0.08);
 --ov-edge-light:rgba(191,147,255,0.035);
 --ov-shadow:rgba(0,0,0,0.32);
 --ov-shadow-deep:rgba(0,0,0,0.65);
 --ov-selection:rgba(168,106,232,0.16);
 --ov-progress-track:#392747;
 --ov-chart-line:#bd9fea;
 --ov-chart-grid:rgba(190,178,208,0.10);
 --ov-chart-fill:rgba(146,77,220,0.10);
 --ov-chart-clear:rgba(146,77,220,0);
 --ov-success:#4a9e6a;
 --ov-warning:#b87a2a;
 --ov-danger:#cf7979;
 --ov-cancelled:#a99bb9;
 --ov-success-surface:rgba(74,158,106,0.12);
 --ov-warning-surface:rgba(184,122,42,0.12);
 --ov-danger-surface:rgba(207,121,121,0.12);
}

html,body,#root{height:100%;margin:0;overflow:hidden;background:var(--ov-inset);color:#ECE9F2;font:11px 'Segoe UI',sans-serif}
*{box-sizing:border-box} .chart{height:100%;position:relative;padding:2px 0 0}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#B9AACD;font-size:11px;pointer-events:none}
.unit{position:absolute;right:9px;top:2px;font-size:9px;color:#B9AACD;pointer-events:none}
.recharts-tooltip-wrapper{outline:none}.tip{border:1px solid var(--ov-border);background:var(--ov-panel-raised);border-radius:8px;padding:8px 11px;box-shadow:0 5px 20px #0009;color:#ECE9F2}
</style></head><body><div id="root"></div><script src="chart.js"></script></body></html>
